<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule</title>
<meta name="theme-color" content="#E4E8EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2A2E35" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schedule">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/app/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/app/base.css">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>

<!-- HOME: what you're doing right now -->
<main id="home" class="screen home">
  <a id="nowCard" class="now raised" href="#switch">
    <div class="now-meme inset"><img id="nowImg" alt="" hidden><span id="nowEmpty" class="now-empty" hidden></span></div>
    <div class="now-tag" id="nowTag"></div>
    <div class="now-place" id="nowPlaceRow">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span id="nowPlace"></span>
    </div>
    <div class="now-clock" id="nowClock">0:00:00</div>
  </a>
  <a id="startCard" class="start raised" href="#switch" aria-label="Start" hidden>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </a>
</main>

<!-- SWITCH: where + what -->
<main id="switch" class="screen switch" hidden>
  <a class="icon-btn" href="#home" aria-label="Back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </a>

  <section class="field">
    <div class="field-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
    <input id="placeInput" class="inset" type="text" aria-label="Where" autocomplete="off" enterkeyhint="done">
    <div class="chips" id="placeChips"></div>
  </section>

  <section class="field">
    <div class="field-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"/></svg></div>
    <input id="tagInput" class="inset" type="text" aria-label="What" autocomplete="off" enterkeyhint="done">
    <div class="chips" id="tagChips"></div>
  </section>

  <p class="error" id="switchError" role="alert"></p>
  <button id="go" class="go raised" type="button" aria-label="Switch" disabled>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</main>

<!-- MEME: pick one for the activity you just switched to -->
<main id="meme" class="screen meme" hidden>
  <div class="meme-head" id="memeHead"></div>
  <div class="grid" id="taggedGrid"></div>
  <hr class="rule" id="memeRule">
  <div class="grid" id="restGrid">
    <label class="tile add raised-sm" aria-label="Upload a meme">
      <input id="fileInput" type="file" accept="image/*,video/*" hidden>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </label>
  </div>
  <div class="meme-actions">
    <button id="skip" class="raised" type="button" aria-label="Skip">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button id="done" class="raised accent" type="button" aria-label="Done">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </button>
  </div>
</main>

<!-- EDIT SHEET: rename or delete a place / activity -->
<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet raised" role="dialog" aria-modal="true" aria-label="Edit">
    <input id="sheetInput" class="inset" type="text" aria-label="Name" autocomplete="off" enterkeyhint="done">
    <p class="error" id="sheetError" role="alert"></p>
    <div class="sheet-actions">
      <button id="sheetDelete" class="raised danger" type="button" aria-label="Delete"></button>
      <button id="sheetSave" class="raised accent" type="button" aria-label="Save">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="/app/shared.js"></script>
<script src="/app/app.js"></script>
</body>
</html>
